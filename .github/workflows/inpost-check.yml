name: Check InPost connectivity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/inpost-check.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read actual InPost measurements
        run: python scripts/check-inpost.py
