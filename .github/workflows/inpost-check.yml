name: Check public InPost API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/inpost-check.yml
      - scripts/check-inpost.mjs
      - src/lib/server/inpost.ts
      - src/lib/weather.ts

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read actual measurements from the public Points API
        run: node scripts/check-inpost.mjs
